name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          MYWAVE_DISABLE_FILE_LOG: '1'
        run: pytest -q -k 'not integration and not ui'

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' || contains(github.event.head_commit.message, '[run integration]')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies for integration
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # optional extras for UI tests
          pip install playwright email-validator
          playwright install --with-deps
      - name: Write Google service account from secret
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/write_service_account.py --env-var GOOGLE_SERVICE_ACCOUNT_JSON --out-file instance/service_account.json
      - name: Run integration tests
        env:
          MYWAVE_DISABLE_FILE_LOG: '1'
        run: pytest -q -k 'integration or ui'
