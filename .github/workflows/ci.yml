name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  PYTHON_VERSION: '3.11'
  FLASK_APP: 'app:create_app'
  FLASK_ENV: 'testing'
  DATABASE_URL: 'sqlite:///ci.db'

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatter (black)
        run: |
          git ls-files '*.py' | grep -vE '(^|/)(venv|\.venv)/' | grep -v 'playwright_booking_test\.py' | xargs -r python -m black --check

      - name: Run unit tests
        run: |
          pytest -q

      - name: Verify migrations apply cleanly
        run: |
          flask db upgrade --directory migrations --sql > /tmp/migration.sql

