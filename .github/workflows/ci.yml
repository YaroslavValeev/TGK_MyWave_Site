name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  PYTHON_VERSION: '3.11'
  FLASK_APP: 'app:create_app'
  FLASK_ENV: 'testing'
  DATABASE_URL: 'sqlite:///ci.db'

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatter (black)
        run: |
          git fetch origin main --depth=1
          mapfile -t PY_FILES < <(
            git diff --name-only --diff-filter=ACMRT origin/main...HEAD \
              | grep '\.py$' \
              | grep -vE '^(venv|\.venv|env|node_modules)/' \
              || true
          )
          if [ "${#PY_FILES[@]}" -eq 0 ]; then
            echo "No changed Python files to check"
            exit 0
          fi
          echo "Black check for ${#PY_FILES[@]} file(s)"
          python -m black --check "${PY_FILES[@]}"

      - name: Run unit tests
        run: |
          pytest -q

      - name: Verify migrations apply cleanly
        run: |
          flask db upgrade --directory migrations --sql > /tmp/migration.sql

