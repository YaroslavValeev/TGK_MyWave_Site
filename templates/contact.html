{% extends "base.html" %}

{% block content %}
<section class="contact">
  <h2>Контакты</h2>
  <form id="contactForm" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="input-group">
      <span class="input-icon">👤</span>
      <input type="text" id="name" name="name" placeholder="Ваше имя" required aria-label="Ваше имя">
    </div>
    <div class="input-group">
      <span class="input-icon">📞</span>
      <input type="text" id="contact" name="contact" placeholder="Телефон или Telegram" required aria-label="Телефон или Telegram">
    </div>
    <div class="input-group">
      <span class="input-icon">💬</span>
      <textarea id="message" name="message" placeholder="Ваше сообщение" required aria-label="Ваше сообщение"></textarea>
    </div>
    <button type="submit" class="btn-primary">Отправить</button>
  </form>
</section>
{% endblock %}
