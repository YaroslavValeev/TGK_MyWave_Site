{% extends "base.html" %}

{% block title %}Запись на занятие{% endblock %}

{% block content %}
<section class="booking-section">
  <div class="container">
    <h1>Запись на занятие</h1>
    
    <form id="booking-form" class="booking-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="form-group">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" 
               pattern="\+7[0-9]{10}"
               placeholder="+79991234567"
               required>
      </div>
      
      <div class="form-group">
        <label for="date">Дата</label>
        <input type="date" id="date" name="date" required>
      </div>
      
      <div class="form-group">
        <label for="time">Время</label>
        <select id="time" name="time" required>
          <option value="">Выберите время</option>
        </select>
      </div>
      
      <button type="submit" class="btn btn-primary">Записаться</button>
    </form>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/booking.js') }}"></script>
<script nonce="{{ csp_nonce }}">
  // Основная логика формы уже в booking.js
  // Тут только обработка успешной записи
  document.addEventListener('booking:success', function() {
    const m = document.getElementById('successModal');
    if (m) m.setAttribute('aria-hidden', 'false');
    // логирование
    fetch("/api/analytics/event", {
      method: "POST", 
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": document.querySelector('input[name="csrf_token"]').value
      },
      body: JSON.stringify({event: "success_modal_shown"})
    });
  });
</script>
