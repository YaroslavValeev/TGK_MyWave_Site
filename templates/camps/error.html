{% extends "base.html" %}
{% block title %}{{ seo.title }}{% endblock %}
{% block meta %}
  <meta name="robots" content="{{ seo.robots }}">
{% endblock %}
{% block extra_head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/camps.css') }}?v=1" />
{% endblock %}
{% block content %}
<section class="camp-showcase-state section camp-showcase-state--error" role="alert">
  <div class="camp-showcase-state__box">
    <h1>Кемп временно недоступен</h1>
    <p>{{ page_message }}</p>
    <p><a href="{{ url_for('camps.camps_index') }}">← Вернуться к каталогу</a></p>
  </div>
</section>
{% endblock %}
