{% extends "base.html" %}

{% block content %}
    <div class="container">
        <div id="chat-container">
            <h4>Чат с экспертом по вейку</h4>
            <div id="menu-container" class="menu-container">
                <button class="menu-btn" onclick="showSchedule()">Расписание</button>
                <button class="menu-btn" onclick="showFAQ()">FAQ</button>
                <button class="menu-btn" onclick="updateClientData()">Тренировка</button>
                <button class="menu-btn menu-btn-primary" onclick="bookTraining()">Записаться</button>
            </div>
            <div id="chatWindow" class="chat-window"></div>
            <div id="chat-suggestions" class="chat-suggestions"></div>
            <form id="chatForm" onsubmit="return false;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <span class="input-icon">✉️</span>
                    <input type="text" id="chatMessageInput" placeholder="Напишите сообщение..." class="chat-input" aria-label="Поле ввода сообщения" oninput="document.getElementById('sendChatBtn').disabled = !this.value.trim()">
                </div>
                <button type="submit" class="send-button" aria-label="Отправить сообщение" id="sendChatBtn" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 12L22 2L12 22L2 12Z" fill="white"/>
                    </svg>
                </button>
            </form>
            <div class="file-upload">
                <label for="file-upload" class="file-upload-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2ZM18 20H6V4H13V9H18V20ZM12 12V16M10 14H14" stroke="#00BCD4" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Загрузить файл
                </label>
                <input type="file" id="file-upload" onchange="uploadMedia()">
            </div>
            <div id="file-upload-progress" class="progress">
                <div class="bar"></div>
            </div>
        </div>
    </div>
{% endblock %}
