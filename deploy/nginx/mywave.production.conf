# Копия на сервер: /etc/nginx/sites-available/mywave
# Production domain: mywavewake.ru
# Выпуск сертификата: sudo certbot --nginx -d mywavewake.ru -d www.mywavewake.ru

server {
    listen 80;
    listen [::]:80;
    server_name mywavewake.ru www.mywavewake.ru;
    return 301 https://mywavewake.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mywavewake.ru;

    ssl_certificate /etc/letsencrypt/live/mywavewake.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mywavewake.ru/privkey.pem;

    return 301 https://mywavewake.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mywavewake.ru;

    ssl_certificate /etc/letsencrypt/live/mywavewake.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mywavewake.ru/privkey.pem;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /static/ {
        alias /var/www/mywave/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Optional compatibility path. Keep mywave-node.service enabled only if /node-chat/* is required.
    location /node-chat/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
