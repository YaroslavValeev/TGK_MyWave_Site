# Nginx перед контейнерами (docker compose). Прод: см. mywave.production.conf
upstream mywave_flask {
    server web:5000;
}

upstream mywave_node {
    server node-chat:5001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://mywave_flask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://mywave_flask/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /node-chat/ {
        proxy_pass http://mywave_node/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
