# SpotMap public embed host
# Копия на сервер: /etc/nginx/sites-available/map.mywavewake.ru
# DNS: A-запись map.mywavewake.ru → IP VPS
# Сертификат: sudo certbot --nginx -d map.mywavewake.ru
# Upstream SpotMap по умолчанию: 127.0.0.1:18080

server {
    listen 80;
    listen [::]:80;
    server_name map.mywavewake.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name map.mywavewake.ru;

    ssl_certificate /etc/letsencrypt/live/map.mywavewake.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.mywavewake.ru/privkey.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Разрешаем встраивание с сайта MyWave (SpotMap сам проверяет EMBED_ALLOWED_HOSTS)
    # Не ставим X-Frame-Options: DENY/SAMEORIGIN — иначе iframe с mywavewake.ru не откроется.

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
