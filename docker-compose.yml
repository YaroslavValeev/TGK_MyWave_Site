# Полный стек для production-like окружения (локально / сервер).
# Секреты: только через .env (не коммитить). Пример: cp env.example .env
#
# Запуск: docker compose up -d --build
# WebSocket + один воркер: GUNICORN_WORKERS=1. Для workers>1 задать REDIS и SOCKETIO_MESSAGE_QUEUE.
#
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      GUNICORN_WORKERS: "1"
      GUNICORN_BIND: 0.0.0.0:5000
      GUNICORN_WORKER_CLASS: eventlet
      # Масштабирование Socket.IO:
      # SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - mywave-data:/app/instance
      - mywave-logs:/app/logs
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  node-chat:
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "5001"
      HOST: "0.0.0.0"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||5001;require('http').get('http://127.0.0.1:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    command: ["python", "telegram_bot.py"]
    volumes:
      - .:/app
    working_dir: /app

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      node-chat:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8088:8080"

volumes:
  redis-data:
  mywave-data:
  mywave-logs:
  grafana-data:
