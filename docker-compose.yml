version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: mywave_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mywave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-mywave_safari}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mywave_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mywave_network
    restart: unless-stopped

  # Redis for SocketIO and caching
  redis:
    image: redis:7-alpine
    container_name: mywave_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mywave_network
    restart: unless-stopped

  # MyWave Flask Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywave_app
    environment:
      FLASK_APP: main.py
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mywave_user}:${POSTGRES_PASSWORD:-secure_password_123}@db:5432/${POSTGRES_DB:-mywave_safari}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      SECRET_KEY: ${SECRET_KEY:-dev_key_change_in_production}
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/instance/service_account.json
    ports:
      - "5000:5000"  # Flask app
      - "5001:5001"  # SocketIO (if needed)
      - "9090:9090"  # Prometheus metrics (optional)
    volumes:
      - ./instance:/app/instance:ro
      - ./static:/app/static:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/metrics/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mywave_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: mywave_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - mywave_network
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:

networks:
  mywave_network:
    driver: bridge